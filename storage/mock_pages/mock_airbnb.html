<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airbnb - Availability Calendar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Circular', -apple-system, sans-serif; background: #f7f7f7; padding: 24px; }
        .header { background: #FF5A5F; color: white; padding: 16px 24px; border-radius: 12px 12px 0 0; }
        .header h1 { font-size: 20px; }
        .header p { font-size: 13px; opacity: 0.9; margin-top: 4px; }
        .calendar-container { background: white; border: 1px solid #ddd; border-radius: 0 0 12px 12px; padding: 24px; }
        .month-title { font-size: 18px; font-weight: 600; margin-bottom: 12px; color: #222; }
        .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 4px; }
        .weekday { text-align: center; font-size: 12px; font-weight: 600; color: #717171; padding: 8px 0; }
        .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
        .day { text-align: center; padding: 12px 8px; font-size: 14px; border-radius: 50%; cursor: pointer; transition: background 0.2s; position: relative; }
        .day.empty { background: transparent; cursor: default; }
        .day.available { background: white; color: #222; border: 1px solid #e0e0e0; }
        .day.available:hover { background: #f0f0f0; }
        .day.blocked { background: #f0f0f0; color: #b0b0b0; text-decoration: line-through; cursor: default; }
        .day.blocked::after { content: ''; position: absolute; top: 50%; left: 20%; right: 20%; height: 1px; background: #b0b0b0; }
        .status-bar { margin-top: 16px; padding: 12px 16px; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 8px; font-size: 13px; color: #166534; display: none; }
        .status-bar.visible { display: block; }
        .legend { display: flex; gap: 20px; margin-top: 16px; padding-top: 16px; border-top: 1px solid #eee; }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #555; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
        .legend-dot.avail { background: white; border: 1px solid #e0e0e0; }
        .legend-dot.block { background: #f0f0f0; border: 1px solid #d0d0d0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Airbnb - Availability Manager</h1>
        <p>Villa Sunset Paradise | Listing #AIR-77320</p>
    </div>
    <div class="calendar-container">
        <div class="month-title">January 2026</div>
        <div class="weekdays">
            <div class="weekday">Mon</div><div class="weekday">Tue</div><div class="weekday">Wed</div>
            <div class="weekday">Thu</div><div class="weekday">Fri</div><div class="weekday">Sat</div><div class="weekday">Sun</div>
        </div>
        <div class="days" id="calendar-grid">
            <div class="day empty"></div><div class="day empty"></div><div class="day empty"></div>
            <div class="day available" data-date="2026-01-01">1</div>
            <div class="day available" data-date="2026-01-02">2</div>
            <div class="day available" data-date="2026-01-03">3</div>
            <div class="day available" data-date="2026-01-04">4</div>
            <div class="day available" data-date="2026-01-05">5</div>
            <div class="day available" data-date="2026-01-06">6</div>
            <div class="day available" data-date="2026-01-07">7</div>
            <div class="day available" data-date="2026-01-08">8</div>
            <div class="day available" data-date="2026-01-09">9</div>
            <div class="day available" data-date="2026-01-10">10</div>
            <div class="day available" data-date="2026-01-11">11</div>
            <div class="day available" data-date="2026-01-12">12</div>
            <div class="day available" data-date="2026-01-13">13</div>
            <div class="day available" data-date="2026-01-14">14</div>
            <div class="day available" data-date="2026-01-15">15</div>
            <div class="day available" data-date="2026-01-16">16</div>
            <div class="day available" data-date="2026-01-17">17</div>
            <div class="day available" data-date="2026-01-18">18</div>
            <div class="day available" data-date="2026-01-19">19</div>
            <div class="day available" data-date="2026-01-20">20</div>
            <div class="day available" data-date="2026-01-21">21</div>
            <div class="day available" data-date="2026-01-22">22</div>
            <div class="day available" data-date="2026-01-23">23</div>
            <div class="day available" data-date="2026-01-24">24</div>
            <div class="day available" data-date="2026-01-25">25</div>
            <div class="day available" data-date="2026-01-26">26</div>
            <div class="day available" data-date="2026-01-27">27</div>
            <div class="day available" data-date="2026-01-28">28</div>
            <div class="day available" data-date="2026-01-29">29</div>
            <div class="day available" data-date="2026-01-30">30</div>
            <div class="day available" data-date="2026-01-31">31</div>
        </div>
        <div class="status-bar" id="status-bar">Dates updated successfully.</div>
        <div class="legend">
            <div class="legend-item"><div class="legend-dot avail"></div> Available</div>
            <div class="legend-item"><div class="legend-dot block"></div> Blocked</div>
        </div>
    </div>
    <script>
        document.querySelectorAll('.day.available').forEach(cell => {
            cell.addEventListener('click', function() {
                if (this.classList.contains('available')) {
                    this.classList.remove('available');
                    this.classList.add('blocked');
                    const status = document.getElementById('status-bar');
                    status.textContent = `Date ${this.dataset.date} blocked successfully.`;
                    status.classList.add('visible');
                    setTimeout(() => status.classList.remove('visible'), 2000);
                }
            });
        });
    </script>
</body>
</html>
